<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin The Wheel - Chances to Win</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fdf6e3;
            background-image: radial-gradient(#f7e1b5 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .wheel-container-wrapper {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1/1;
            margin: 0 auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3));
        }

        .wheel-border {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFDF00, #D4AF37, #996515, #FFDF00);
            padding: 20px; /* Thickness of the gold border */
            box-shadow: 
                inset 0 0 10px rgba(0,0,0,0.5),
                0 0 15px rgba(255,215,0,0.4);
        }

        /* The inner track where the lights sit */
        .wheel-inner-border {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #8b0000; /* Dark red track for lights */
            position: relative;
            padding: 15px; /* Space between lights track and actual wheel */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.7);
        }

        /* The canvas that actually spins */
        #spinWheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #fff;
            display: block;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            /* We handle the spinning via JS modifying the transform */
            transform-origin: center;
        }

        .wheel-pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 80px;
            z-index: 20;
            background: radial-gradient(ellipse at top, #FFDF00, #D4AF37);
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
            /* Inner drop shadow trick using svg filter in real life, but simple borders here */
            border-top: 4px solid #fff;
        }
        
        .pointer-pin {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fff, #D4AF37);
            border-radius: 50%;
            z-index: 21;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .center-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25%;
            height: 25%;
            background: linear-gradient(135deg, #FFDF00, #D4AF37, #996515);
            border-radius: 50%;
            z-index: 30;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: clamp(1rem, 4vw, 1.5rem);
            font-weight: 900;
            color: #000;
            border: 4px solid #fff;
            box-shadow: 
                0 0 20px rgba(0,0,0,0.5),
                inset 0 0 10px rgba(255,255,255,0.8);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .center-button:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), inset 0 0 10px rgba(255,255,255,1);
        }

        .center-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        .wheel-stand {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 60px;
            background: #1a202c;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: -1;
            box-shadow: inset 0 10px 10px rgba(0,0,0,0.5);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }

        .light-bulb {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8), inset 0 0 2px #ff0;
            transform: translate(-50%, -50%);
        }

        #winModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #fff;
            padding: 3rem 2rem;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 0 10px rgba(255,215,0,0.3);
            border: 4px solid #D4AF37;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

    <!-- To use your own image, download this HTML file and place image_fc6392.jpg in the same folder, or replace the src attribute with a hosted image URL. -->
    <img src="image_fc6392.jpg" alt="Spin The Wheel Chances to Win!" class="w-full max-w-3xl mx-auto mb-8 rounded-xl shadow-lg border-2 border-yellow-500 object-contain">

    <div class="wheel-container-wrapper relative">
        <div class="wheel-pointer"></div>
        <div class="pointer-pin"></div>
        
        <div class="wheel-border">
            <div class="wheel-inner-border" id="lightsContainer">
                <canvas id="spinWheel" width="800" height="800"></canvas>
            </div>
        </div>

        <div class="center-button" id="spinButton">
            SPIN<br>&<br>WIN!
        </div>

        <div class="wheel-stand"></div>
    </div>

    <div class="mt-12 text-center max-w-2xl bg-white p-4 rounded-xl shadow-lg border-b-4 border-yellow-500">
        <p class="font-bold text-gray-800 text-lg sm:text-xl">
            MORE VD ACHIEVED, MORE CHANCES TO SPIN,<br>
            <span class="text-yellow-600 text-2xl">MORE REWARDS TO WIN!</span>
        </p>
    </div>

    <div id="winModal">
        <div class="modal-content">
            <h2 class="text-3xl font-black text-blue-900 mb-2 uppercase">Congratulations!</h2>
            <p class="text-gray-600 font-bold mb-6">You have won:</p>
            <div id="winResult" class="text-4xl font-black text-yellow-600 mb-8 px-4 py-6 bg-yellow-50 rounded-xl border border-yellow-200">
                Reward
            </div>
            <button onclick="closeModal()" class="bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 px-8 rounded-full text-xl transition shadow-lg w-full">
                Awesome!
            </button>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * ⚙️ SEGMENTS CONFIGURATION (EDIT HERE)
         * ==========================================
         * 
         * HOW TO ADD YOUR OWN PRODUCT IMAGES:
         * 1. Upload your product image somewhere and get the URL (e.g., "https://yoursite.com/product.png").
         * 2. Replace the `image: null` with your URL inside quotes: `image: "https://yoursite.com/product.png"`
         * 3. If an `image` URL is provided, the wheel will draw the image instead of the emoji/icon text.
         * 
         * IMPORTANT:
         * - Use images with transparent backgrounds (PNG) for best results.
         * - Keep images square.
         */
        const segments = [
            { 
                text: "LADIES\nHAND\nBAG", 
                color: "#6A1B9A", // Purple
                icon: "💳",
                image: "https://m.media-amazon.com/images/I/61Iu59wDmcS._SY695_.jpg" 
            },
            { 
                text: "HEADPHONES", 
                color: "#1565C0", // Blue
                icon: "🎧",
                image: "https://www.boat-lifestyle.com/cdn/shop/files/Artboard_2_0937e9e7-33ba-44ee-892d-ad427998ef7c_1044x.png?v=1775545161" 
            },
            { 
                text: "SPEAKERS", 
                color: "#2E7D32", // Green
                icon: "🛍️",
                image: "https://m.media-amazon.com/images/I/41QBa9gm++L._SY300_SX300_QL70_FMwebp_.jpg" 
            },
            { 
                text: "BAGPACK", 
                color: "#EF6C00", // Orange
                icon: "⌚",
                image: "https://m.media-amazon.com/images/I/31bOxxWWIeL._SY300_SX300_QL70_FMwebp_.jpg" 
            },
            { 
                text: "MAKEUP\nKIT", 
                color: "#C62828", // Red
                icon: "✈️",
                image: "https://rukminim2.flixcart.com/image/1280/1280/xif0q/makeup-kit/i/h/d/premium-makeup-kit-for-women-coslane-original-imahp9n3764djhhg.jpeg?q=90"
            },
            { 
                text: "MANAGER\nOFFER", 
                color: "#00838F", // Teal
                icon: "🎁",
                image: "Soef.JPG" 
            },
            { 
                text: "SPIN\nAGAIN", 
                color: "#AD1457", // Pink
                icon: "%\uFE0F",
                image: null 
            }
        ];

        const canvas = document.getElementById('spinWheel');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY);
        const arc = Math.PI * 2 / segments.length;

        // Pre-load images if provided in config
        const loadedImages = {};
        let imagesToLoad = 0;

        function init() {
            // Check for images to load
            segments.forEach((seg, index) => {
                if (seg.image) {
                    imagesToLoad++;
                    const img = new Image();
                    img.crossOrigin = "Anonymous"; // Helps with canvas tainting if external
                    img.onload = () => {
                        loadedImages[index] = img;
                        imagesToLoad--;
                        if (imagesToLoad === 0) drawWheel();
                    };
                    img.src = seg.image;
                }
            });

            // Generate border lights
            generateLights();

            if (imagesToLoad === 0) {
                drawWheel();
            }
            
            generateConfetti();
        }

        function generateConfetti() {
            const container = document.getElementById('confettiContainer');
            if(!container) return;
            const colors = ['#004b87', '#FFDF00', '#EF6C00', '#C62828', '#1565C0'];
            for(let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + '%';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Randomize size and animation
                const size = (Math.random() * 8 + 6) + 'px';
                conf.style.width = size;
                conf.style.height = (Math.random() > 0.5 ? size : (Math.random() * 15 + 10) + 'px');
                
                conf.style.animationDuration = (Math.random() * 3 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(conf);
            }
        }

        function generateLights() {
            const container = document.getElementById('lightsContainer');
            const numLights = 24;
            // The radius for the lights is roughly 50% of the container minus padding
            // We use standard trigonometry to place them absolute within the wrapper
            for (let i = 0; i < numLights; i++) {
                const light = document.createElement('div');
                light.className = 'light-bulb';
                
                const angle = (i / numLights) * (2 * Math.PI);
                // 50% is center. Radius is ~48% to stay inside the red track
                const x = 50 + 48 * Math.cos(angle);
                const y = 50 + 48 * Math.sin(angle);
                
                light.style.left = `${x}%`;
                light.style.top = `${y}%`;
                
                // Add a simple twinkling effect delay
                light.style.animation = `twinkle 1.5s infinite alternate ${Math.random()}s`;
                container.appendChild(light);
            }
        }

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw segments
            for (let i = 0; i < segments.length; i++) {
                const angle = i * arc;
                
                // Draw slice
                ctx.beginPath();
                ctx.fillStyle = segments[i].color;
                // Starting offset by -90deg (-Math.PI/2) so segment 0 is at the top
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle - Math.PI/2, angle + arc - Math.PI/2, false);
                ctx.lineTo(centerX, centerY);
                ctx.fill();

                // Draw separators (gold borders between slices)
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#D4AF37';
                ctx.stroke();

                // Save context for text/image rotation
                ctx.save();
                
                // Move to center, rotate to the middle of the slice
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2 - Math.PI/2);
                
                // Draw Content (Text + Image/Icon)
                drawSegmentContent(i);
                
                ctx.restore();
            }
        }

        function drawSegmentContent(index) {
            const segment = segments[index];
            const textRadius = radius * 0.75; // Distance from center for text
            const iconRadius = radius * 0.45; // Distance from center for icon

            // 1. Draw Text
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 32px Montserrat'; // Adjusted for 800px canvas
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Handle multiline text (split by \n)
            const lines = segment.text.split('\n');
            lines.forEach((line, lineIndex) => {
                // Rotate 90 degrees so text is readable from the edge looking in
                ctx.save();
                ctx.translate(textRadius, 0);
                ctx.rotate(Math.PI / 2);
                ctx.fillText(line, 0, (lineIndex - (lines.length-1)/2) * 36); 
                ctx.restore();
            });

            // 2. Draw Image or Icon
            ctx.save();
            ctx.translate(iconRadius, 0);
            ctx.rotate(Math.PI / 2); // Keep icon upright relative to text

            if (loadedImages[index]) {
                // Draw provided custom image
                const img = loadedImages[index];
                const imgSize = 80; // Size of the product image
                ctx.drawImage(img, -imgSize/2, -imgSize/2, imgSize, imgSize);
            } else {
                // Draw fallback emoji/icon
                ctx.font = '60px Arial'; // Larger font for emoji
                ctx.fillText(segment.icon, 0, 0);
            }
            
            ctx.restore();
        }

        let currentRotation = 0;
        let isSpinning = false;
        const spinButton = document.getElementById('spinButton');
        const modal = document.getElementById('winModal');
        const winResultText = document.getElementById('winResult');

        spinButton.addEventListener('click', spin);

        function spin() {
            if (isSpinning) return;
            isSpinning = true;

            // Generate random extra degrees (between 0 and 360)
            const randomExtraRotation = Math.floor(Math.random() * 360);
            
            // Add 5 full base spins (360 * 5) for dramatic effect
            const spinAmount = (360 * 5) + randomExtraRotation;
            
            currentRotation += spinAmount;

            // Apply CSS transition to spin the canvas
            // Use cubic-bezier for a realistic "fast start, slow end" physics feel
            canvas.style.transition = 'transform 5s cubic-bezier(0.25, 1, 0.1, 1)';
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Wait for transition to finish
            setTimeout(() => {
                determineWinner();
                isSpinning = false;
            }, 5000); // matches the 5s transition
        }

        function determineWinner() {
            // Because we offset the drawing by -90deg (top), Segment 0 starts at Top.
            // As the wheel rotates clockwise (+deg), the pointer effectively moves counter-clockwise (-deg) across the wheel.
            
            // Normalize current rotation to 0-359
            const normalizedRotation = currentRotation % 360;
            
            // Calculate which segment the pointer is currently over.
            // Since pointer is fixed at top and segments rotate clockwise:
            // 0 deg rotation = Segment 0 at top.
            // 45 deg rotation (1 segment width) = Segment 7 moves to top.
            // 90 deg rotation = Segment 6 moves to top.
            
            const segmentAngle = 360 / segments.length; // 45 degrees
            
            // Formula to find the winning index based on CSS rotation:
            let winningIndex = Math.floor((360 - normalizedRotation) / segmentAngle) % segments.length;
            
            const winner = segments[winningIndex];
            
            // Format text for modal (replace newlines with space)
            const winnerText = winner.text.replace('\n', ' ');
            
            showModal(`${winner.icon} ${winnerText}`);
        }

        function showModal(text) {
            winResultText.innerText = text;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Initialize on load
        window.onload = init;
    </script>

    <style>
        /* Small extra animation for the lights added via JS */
        @keyframes twinkle {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        }
    </style>
</body>
</html>
